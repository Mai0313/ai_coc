site_name: CoC AI Controller
site_url: https://mai0313.github.io/CoC-AI-Controller
site_author: CoC AI Controller contributors

repo_name: Mai0313/CoC-AI-Controller
repo_url: https://github.com/Mai0313/CoC-AI-Controller
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
dev_addr: 0.0.0.0:9987

nav:
  - Home: index.md
  - Architecture: architecture.md
  - AI Agent: ai-agent.md
  - Requirements: requirements.md
  - Database Schema: database-schema.md
  - Decisions: decisions.md
  - Roadmap: todo.md

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github-alt
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/Mai0313/CoC-AI-Controller
