# The farm subagent reports the game left the screen mid-battle, and the screen shows the
# launcher with nothing else in front. The takeover looks, then launches the game at once
# instead of waiting first, and goes on with the round.
skill = "takeover"
about = "The game left the screen during a takeover: look, then launch at once without a wait"
situation = """
你在託管中 (今天 15:30 開始, session 一直是你的). 你睡在 `ai_coc watch` 上 (等弓箭女皇跟亡靈到點前五分鐘), 打資源的 subagent 在背景打日世界. 那個 watch 還在睡, 這一回合是 subagent 的回報叫醒你的:

「日世界那一次 attack (`--label tk-d-a1`) 收工在 game_left. 照 runner.md 停下來, 之後沒有再下任何 ai_coc 指令.」
"""
live = [900002]
screens = [{ frame = "ldplayer_launcher.png" }]

[replies]
launch = [{ index = 0, serial = "127.0.0.1:5555", was_running = false, outcome = "at_village" }]

[state.emulator]
status = "idle"
pid = 900001
command = "attack"
started = "2026-11-27T15:50:00+08:00"
ended = "2026-11-27T16:12:00+08:00"
caller = { agent = "claude-code", session = "eval-takeover-game-left-farm", mission = "打日世界資源" }

[state.watch]
status = "running"
pid = 900002
started = "2026-11-27T15:49:00+08:00"
next_at = "2026-11-27T16:39:11+08:00"
about = "弓箭女皇、亡靈到點前五分鐘"
farms = true
caller = { agent = "claude-code", session = "eval-takeover-game-left", mission = "全天候託管到他叫停" }

[[checks]]
id = "looks"
what = "takes one frame of what the screen shows"
anchor = [".agents/skills/takeover/SKILL.md", "先 `ai_coc capture` 留一張"]
kind = "called"
calls = { command = "capture" }

[[checks]]
id = "launches"
what = "launches the game back at once"
anchor = [".agents/skills/takeover/SKILL.md", "馬上 `ai_coc launch` 開回去, 不先等"]
kind = "called"
calls = { command = "launch" }

[[checks]]
id = "no-wait"
what = "does not sleep five minutes on a watch before launching"
anchor = [".agents/skills/takeover/SKILL.md", "馬上 `ai_coc launch` 開回去, 不先等"]
kind = "not_called"
calls = { command = "watch", args = { minutes = 5 } }

[[checks]]
id = "no-hold"
what = "does not hold the emulator to wait"
anchor = [".agents/skills/takeover/SKILL.md", "馬上 `ai_coc launch` 開回去, 不先等"]
kind = "not_called"
calls = { command = "hold" }

[[checks]]
id = "no-stop"
what = "does not stop the takeover: the launcher with nothing in front is a crash, not the user playing"
anchor = [".agents/skills/takeover/SKILL.md", "遊戲當掉了, 馬上 `ai_coc launch` 開回去"]
kind = "not_called"
calls = { command = "stop" }

[[checks]]
id = "named"
what = "every command says who ran it and why"
anchor = ["AGENTS.md", "Every `ai_coc` command an agent runs carries `--agent`"]
kind = "every_call_has"
fields = ["agent", "session", "mission"]
