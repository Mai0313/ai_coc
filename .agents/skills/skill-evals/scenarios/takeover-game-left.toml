# The farm subagent reports the game left the screen mid-battle, and the screen shows the
# launcher with nothing else in front. The takeover waits five minutes on a hold, as it does
# for a login taken, and drives nothing until then.
skill = "takeover"
about = "The game left the screen during a takeover: look, then a five-minute held watch and nothing else"
situation = """
你在託管中 (今天 15:30 開始, session 一直是你的). 你睡在 `ai_coc watch` 上 (等弓箭女皇跟亡靈到點前五分鐘), 打資源的 subagent 在背景打日世界. 那個 watch 還在睡, 這一回合是 subagent 的回報叫醒你的:

「日世界那一次 attack (`--label tk-d-a1`) 收工在 game_left. 照 runner.md 停下來, 之後沒有再下任何 ai_coc 指令.」
"""
live = [900002]
screens = [{ frame = "ldplayer_launcher.png" }]

[state.emulator]
status = "idle"
pid = 900001
command = "attack"
started = "2026-11-27T15:50:00+08:00"
ended = "2026-11-27T16:12:00+08:00"
caller = { agent = "claude-code", session = "eval-takeover-game-left-farm", mission = "打日世界資源" }

[state.watch]
status = "running"
pid = 900002
started = "2026-11-27T15:49:00+08:00"
next_at = "2026-11-27T16:39:11+08:00"
about = "弓箭女皇、亡靈到點前五分鐘"
farms = true
caller = { agent = "claude-code", session = "eval-takeover-game-left", mission = "全天候託管到他叫停" }

[[checks]]
id = "looks"
what = "takes one frame of what the screen shows"
anchor = [".agents/skills/takeover/SKILL.md", "先 `ai_coc capture` 留一張"]
kind = "called"
calls = { command = "capture" }

[[checks]]
id = "no-stop"
what = "does not stop: that would end the watch it is about to set"
anchor = [".agents/skills/takeover/SKILL.md", "不下 `ai_coc stop` 也不 `giveback`, 理由一樣"]
kind = "not_called"
calls = { command = "stop" }

[[checks]]
id = "no-giveback"
what = "does not give the emulator back"
anchor = [".agents/skills/takeover/SKILL.md", "不下 `ai_coc stop` 也不 `giveback`, 理由一樣"]
kind = "not_called"
calls = { command = "giveback" }

[[checks]]
id = "nothing-claims"
what = "does not launch the game before the five minutes are up, nor run anything that logs it in"
anchor = [".agents/skills/takeover/SKILL.md", "所以先等五分鐘"]
kind = "nothing_claims"

[[checks]]
id = "watch-five"
what = "sleeps five minutes on a watch with no upgrade, tower or helper wake, still farming"
anchor = [".agents/skills/takeover/SKILL.md", "重掛 `ai_coc watch --minutes 5 --hold`"]
kind = "called"
calls = { command = "watch", args = { minutes = 5, farms = true }, unset = ["upgrades", "tower", "helpers", "next"] }

[[checks]]
id = "watch-holds"
what = "holds the emulator through those five minutes, so no other session launches the game"
anchor = [".agents/skills/takeover/SKILL.md", "重掛 `ai_coc watch --minutes 5 --hold`"]
kind = "called"
calls = { command = "watch", args = { minutes = 5, hold = true } }

[[checks]]
id = "reply-five"
what = "tells the user it looks again in five minutes"
anchor = [".agents/skills/takeover/SKILL.md", "跟他講五分鐘後會再看一次"]
kind = "reply"
pattern = "五分鐘|5 ?分鐘"

[[checks]]
id = "named"
what = "every command says who ran it and why"
anchor = ["AGENTS.md", "Every `ai_coc` command an agent runs carries `--agent`"]
kind = "every_call_has"
fields = ["agent", "session", "mission"]
