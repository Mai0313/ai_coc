# Mid-takeover the user says what a maxing building should give way to: it is kept as a
# note and the table comes back with that row's next step filled in.
skill = "takeover"
about = "A new instruction mid-takeover: kept as a note, and the table reprinted"
situation = """
你在託管中 (今天 15:30 開始, session 一直是你的). 上一次醒來是 16:11, 你重讀了 `status` 再掛上 `ai_coc watch`, 它還在睡. 打資源的 subagent 在背景打夜世界. 這段對話之前的內容已經被壓縮掉了.
"""
user = "多人箭塔升完改升法師塔"
live = [900001, 900002]

[state.emulator]
status = "running"
pid = 900001
command = "attack"
started = "2026-11-12T16:05:00+08:00"
yields = true
caller = { agent = "claude-code", session = "eval-takeover-new-instruction-farm", mission = "打夜世界資源" }

[state.watch]
status = "running"
pid = 900002
started = "2026-11-12T16:12:10+08:00"
next_at = "2026-11-12T16:39:11+08:00"
about = "弓箭女皇、亡靈到點前五分鐘"
farms = true
caller = { agent = "claude-code", session = "eval-takeover-new-instruction", mission = "全天候託管到他叫停" }

[[checks]]
id = "note"
what = "keeps the instruction as a day note naming both buildings"
anchor = [".agents/skills/takeover/SKILL.md", "交代的用 `ai_coc note add"]
kind = "called"
calls = { command = "note", args = { action = "add", world = "day" }, patterns = { item = "多人箭塔.*法師塔" } }

[[checks]]
id = "reprint"
what = "reprints the table with that row's next step set to the instruction"
anchor = [".agents/skills/takeover/SKILL.md", "託管中他交代了新的, 記好之後回覆裡再印一次升級的表"]
kind = "table_cell"
row = '\| 工人 \|.*多人箭塔'
pattern = '改升 ?法師塔'

[[checks]]
id = "no-borrow"
what = "borrows nothing to do it: the table comes from the last status"
anchor = [".agents/skills/takeover/SKILL.md", "前三欄照最近一次 `status` 印的"]
kind = "nothing_claims"

[[checks]]
id = "named"
what = "every command says who ran it and why"
anchor = ["AGENTS.md", "Every `ai_coc` command an agent runs carries `--agent`"]
kind = "every_call_has"
fields = ["agent", "session", "mission"]
