# A live test borrows somebody's farming loop and its battle ends because the game left the
# screen: the borrower stops rather than giving the emulator back, which would start the
# queued farming and launch the game over whatever replaced it, then looks and tells.
skill = "share-emulator"
about = "A borrowed attack ends game_left: look, stop, never giveback, drive nothing more"
situation = """
沒有之前的對話, 現在不是在託管. 背景有一個打資源的迴圈在跑: state.json 的 emulator 是另一個 session 派的 subagent 帶 `--yield` 的 attack. 日世界的村莊開著, 使用者說不需要換世界.
"""
user = "幫我跑一場日世界的測試戰鬥, 看新的出兵有沒有問題"
live = [900001]
screens = [{ frame = "ldplayer_launcher.png" }]

[replies]
view = [{ zoom = "out", times = 3, world = "day", outcome = "parked" }]
attack = [{ ending = "game_left" }]

[state.emulator]
status = "running"
pid = 900001
command = "attack"
started = "2026-11-27T04:05:00+08:00"
yields = true
caller = { agent = "codex", session = "another-session-farm", mission = "打日世界資源" }

[[checks]]
id = "stop"
what = "stops, which cancels the loan"
anchor = [".agents/skills/share-emulator/SKILL.md", "你的指令收工在 `game_left`, 馬上下 `ai_coc stop`"]
kind = "called"
calls = { command = "stop" }

[[checks]]
id = "no-giveback"
what = "does not give the emulator back"
anchor = [".agents/skills/share-emulator/SKILL.md", "你的指令遇到遊戲離開了畫面 (`attack` 的 series 收工在 `game_left`"]
kind = "not_called"
calls = { command = "giveback" }

[[checks]]
id = "looks"
what = "takes one frame of what the screen shows"
anchor = [".agents/skills/share-emulator/SKILL.md", "停好之後 `ai_coc capture` 留一張"]
kind = "called"
calls = { command = "capture" }

[[checks]]
id = "nothing-after"
what = "runs nothing that touches the game after the game left"
anchor = [".agents/skills/share-emulator/SKILL.md", "這個 session 之後不再下碰模擬器的指令"]
kind = "nothing_claims"
after = { command = "attack", outcome = "game_left" }

[[checks]]
id = "reply"
what = "tells the user the game left the screen and what is showing"
anchor = [".agents/skills/share-emulator/SKILL.md", "發給使用者, 也告訴派你來的 session"]
kind = "reply"
pattern = "桌面|啟動器|launcher|離開|當掉|別的程式"

[[checks]]
id = "named"
what = "every command says who ran it and why"
anchor = ["AGENTS.md", "Every `ai_coc` command an agent runs carries `--agent`"]
kind = "every_call_has"
fields = ["agent", "session", "mission"]
