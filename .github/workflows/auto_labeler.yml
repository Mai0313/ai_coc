name: Pull Request Labeler

# pull_request, not pull_request_target: GitHub's default policy blocks pull_request_target in public repositories (enforced from 2026-12-02). A fork's run gets a read-only token, so the job skips it and its pull request is labeled by hand.

on:
  pull_request:

permissions: write-all

jobs:
  labeler:
    name: Labeler
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Labeler
        id: labeler
        uses: actions/labeler@v7
        with:
          sync-labels: true
          configuration-path: .github/labeler.yml
