name: Tests

# The diff decides whether the suite runs, never the branch name: a conventional-commits type says
# what a change is for and nothing about what it touched, so a `chore/`, `ci/` or `docs/` branch
# carrying code has to be tested like any other. The `paths` below skip pure prose, except the
# Markdown under `src/`: those are the prompts, which the suite loads and fills, so a prompt-only
# change is code and gets tested. The last matching pattern wins.
on:
  push:
    branches:
      - main
      - master
      - release/*
    paths:
      - "**"
      - "!**/*.md"
      - "src/**/*.md"
  pull_request:
    branches:
      - main
      - master
      - release/*
    paths:
      - "**"
      - "!**/*.md"
      - "src/**/*.md"

permissions: write-all

jobs:
  run_tests:
    name: Run Tests
    # Windows, and not as a preference: `adapters/emulator.py` imports `winreg`
    # at module scope and `commands.py` imports that, so on Linux `test_core.py`
    # fails to import at all. It did, silently, for as long as this matrix said
    # ubuntu — 208 tests never ran and the job still went green.
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
        python-version:
          - "3.12"

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        # Every step without a shell of its own runs under `pwsh` on a Windows
        # runner, and PowerShell neither aborts on a native command's non-zero
        # exit nor reports anything but the last one's. Two commands here, so
        # without this a failed pin would be invisible.
        shell: bash
        run: |
          uv python pin ${{ matrix.python-version }}
          uv sync --group test

      - name: Check for tests
        id: check_tests
        shell: bash
        run: |
          if [ -f tests/test_*.py ] || [ -d tests ]; then
              echo "Tests exist, proceeding to run them."
              echo "has_tests=true" >> $GITHUB_OUTPUT
          else
              echo "No tests to run."
              echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run pytest
        if: ${{ steps.check_tests.outputs.has_tests == 'true' }}
        # `shell: bash` is the load-bearing half: Actions runs it as
        # `bash --noprofile --norc -eo pipefail`, while the implicit shell it
        # replaces is `bash -e` — errexit without pipefail, which is what let
        # `tee` report success over a pytest that had failed. The explicit
        # `set -o pipefail` below is belt and braces, and says so out loud.
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -vv | tee .coverage.txt

      # There is no issue to comment on outside a pull request, so a push to main
      # would fail this step on every matrix leg.
      - name: Pytest coverage comment
        if: ${{ github.event_name == 'pull_request' && steps.check_tests.outputs.has_tests == 'true' }}
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./.coverage.txt
          junitxml-path: ./.github/reports/.coverage.pytest.xml
          pytest-xml-coverage-path: ./.github/reports/coverage.xml
          unique-id-for-comment: ${{ matrix.python-version }}-${{ matrix.os }}
          title: Coverage for Python ${{ matrix.python-version }} on ${{ matrix.os }}
          hide-emoji: true
