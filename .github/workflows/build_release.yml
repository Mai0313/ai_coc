name: Build and Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      package_mode:
        description: "PyInstaller layout"
        type: choice
        default: onedir
        options:
          - onedir
          - onefile

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    timeout-minutes: 30

    # onedir ships a folder next to an `_internal/`; onefile unpacks the whole
    # bundle into a temp dir on every launch, which costs seconds of startup.
    # A tag build takes the fast one; pick the other from the dispatch form.
    env:
      PACKAGE_MODE: ${{ inputs.package_mode || 'onedir' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # MuMu Player, PyQt5-Qt5 and ctypes.windll are Windows-only, so the
          # other runners have nothing to build.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            friendly_id: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          uv add pyinstaller
          uv sync --no-dev

      - name: Packaging to Executable file
        run: |
          uv run pyinstaller src/${{ github.event.repository.name }}/cli.py --${{ env.PACKAGE_MODE }} --windowed `
            -n ${{ github.event.repository.name }} `
            --add-data "src/${{ github.event.repository.name }}/battle_scripts;${{ github.event.repository.name }}/battle_scripts" `
            --copy-metadata ${{ github.event.repository.name }}

      - name: Create .zip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "dist/${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $version = "${env:GITHUB_REF_NAME}".Substring(1)
          $name = "${{ github.event.repository.name }}"
          $zip = "$name-v$version-${{ matrix.friendly_id }}.zip"
          # onedir leaves a folder, onefile a bare .exe; both sit directly under dist\.
          $payload = if ("${{ env.PACKAGE_MODE }}" -eq "onefile") { "dist\$name.exe" } else { "dist\$name" }
          Compress-Archive -Path $payload -DestinationPath "$dest\$zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.friendly_id }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: true

  package:
    name: Build Package
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Version
        id: version
        shell: bash
        run: |
          VERSION=$(uvx dunamai from git --bump --no-metadata --style pep440)
          uv version $VERSION --frozen
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # - name: Update Version
      #   id: version
      #   shell: pwsh
      #   run: |
      #     [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
      #     $env:PYTHONUTF8 = "1"
      #     $VERSION = (uvx dunamai from git --bump --no-metadata --style pep440)
      #     uv version $VERSION --frozen
      #     echo "Version: $VERSION"
      #     echo "VERSION=$VERSION" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
      #     echo "version=$VERSION" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Package
        run: |
          uv build

      - name: Publish Package
        continue-on-error: true
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        run: |
          uv publish --check-url https://pypi.org/simple/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: ./dist/*
          name: ${{ github.event.repository.name }}-py${{ matrix.python-version }}
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6
          overwrite: true

  release:
    name: Release Package
    needs:
      - build
      - package
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**/*
