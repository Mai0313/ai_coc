# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
name: Dependabot Auto Merge

on:
  pull_request:

permissions: write-all

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Dependency review needs GitHub Advanced Security on a private repository,
    # so the action refuses to run while this one stays private.
    if: github.event.repository.visibility == 'public'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0

  dependabot-auto-merge:
    name: Dependabot Auto Merge
    needs: dependency-review
    runs-on: ubuntu-latest
    if: >-
      always()
      && (needs.dependency-review.result == 'success' || needs.dependency-review.result == 'skipped')
      && github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "${{ github.event.pull_request.html_url }}"

      - name: Enable auto-merge for Dependabot PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --squash --auto --delete-branch "${{ github.event.pull_request.html_url }}"
