name: Publish GitHub Pages

on:
  push:
    branches:
      - main
      - master
    # No tag trigger: the github-pages environment only accepts deployments from
    # main, so a tag push fails before any step runs. Publishing from main
    # already covers every tagged commit.

permissions: write-all

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # `actions/deploy-pages` deploys into this environment and fails without it.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy docs
        run: |
          uv sync --group docs
          uv run make gen-docs
          uv run zensical build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Suffix the artifact name with the attempt number so a re-run does not
      # collide with the previous attempt's artifact (deploy-pages fails on
      # duplicate names within one run).
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
          name: github-pages-${{ github.run_attempt }}

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
